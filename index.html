<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>CRUD SYSTEM</title>
  </head>
  <body>
    <div class="crud">
      <div class="head">
        <h1>CRUDS</h1>
        <p>Product Management System</p>
      </div>

      <div class="inputs">
        <input placeholder="title.."  type="text" name="title" id="title" />
        <div class="price">
          <input onkeyup="getTotal()"  placeholder="price" type="number" id="price" />
          <input onkeyup="getTotal()"  placeholder="taxes" type="number" id="taxes" />
          <input onkeyup="getTotal()"  placeholder="ads" type="number" id="ads" />
          <input onkeyup="getTotal()"  placeholder="% discount" type="number" id="discount" />
          <small  id="total"></small>
        </div>
        <input placeholder="count" type="number" id="count" />
        <input placeholder="category"  type="text" id="category" />
        <button   id="submit">Create ➕</button>
      </div>
      <div class="outputs">
        <div class="search">
          <input onkeyup="searchData(this.id)" type="text" id="search" placeholder="Search.." />
          <div class="search-buttons">
            <button  onclick="changeSearchMood(this.id)" id="search-title">Search By Title 📜</button>
            <button  onclick="changeSearchMood(this.id)"  id="search-category">Search By Category 📚</button>
        </div>
        <button class="hidden" id="delete-all">Delete ALl </button>

      </div>

      <table>
        <thead>
          <th>ID</th>
          <th>Title</th>
          <th>Price</th>
          <th>Taxes</th>
          <th>Ads</th>
          <th>Discount</th>
          <th>Total</th>
          <th>Category</th>
          <th>Update</th>
          <th>Delete</th>
        </thead>
        <tbody id="tbody">
          
         
        </tbody>
      </table>
    </div>

    <script src="main.js"></script>
  </body>
</html>
